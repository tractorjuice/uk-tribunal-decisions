name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all scripts
        run: python3 -m compileall -q scripts/

      - name: Extraction unit tests
        # These cover the regexes that produce most published fields. They exist
        # because a group(0)/group(1) slip and a missing negative lookbehind
        # each reached production and corrupted thousands of records.
        run: python3 scripts/test_extraction.py

      - name: Validate published data
        run: python3 scripts/verify_data.py
